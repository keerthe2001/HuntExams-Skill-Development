# Local production-like run:  HX_SECRET_KEY=... docker compose up --build   → http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: huntexams, POSTGRES_PASSWORD: huntexams, POSTGRES_DB: huntexams }
    volumes: [hx-db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U huntexams"], interval: 5s, retries: 10 }
  app:
    build: .
    ports: ["8080:10000"]
    environment:
      HX_DATABASE_URL: postgresql://huntexams:huntexams@db:5432/huntexams
      HX_SECRET_KEY: ${HX_SECRET_KEY:?Set HX_SECRET_KEY (32+ random characters)}
      HX_COOKIE_SECURE: "false"
      HX_ADMIN_EMAILS: ${HX_ADMIN_EMAILS:-}
      HX_PUBLIC_SITE_URL: http://localhost:8080
    depends_on: { db: { condition: service_healthy } }
volumes:
  hx-db:
