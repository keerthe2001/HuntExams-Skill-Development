<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060d" />
    <meta name="description" content="Learn agentic AI engineering by watching each concept move, then building it in real Python. Guided labs, missions and a verifiable certificate." />
    <title>HuntExams</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; system fonts show until they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
    <script>
      try { if (localStorage.getItem("hx-theme") === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>HuntExams needs JavaScript for its interactive scenes and Python sandbox.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
